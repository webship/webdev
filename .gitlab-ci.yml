include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # For now, build and test with Drupal 11.4 and PHP 8.5.
  DRUPAL_CORE: "11.4.x-dev"
  _TARGET_PHP: "8.5"
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  # No yarn.lock is committed; Yarn 4 defaults to immutable installs and would
  # refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# Override the default composer job to use development versions
composer:
  variables:
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: 0

.composer-base:
  variables:
    # Drupal core's own Yarn 4.9.1 would read the project .yarnrc.yml (Yarn >= 4.14 keys) too.
    YARN_RC_FILENAME: .yarnrc.core.yml
    YARN_NODE_LINKER: node-modules

cspell:
  stage: validate
  image: node:24
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

# Node 24: package.json requires engines.node ">= 24.0".
# Shared setup for the fast lint jobs (eslint, stylelint).
#   1. `dependencies: []` skips the composer build artifact (the full Drupal
#      tree) so the lint jobs don't download and walk thousands of vendor/
#      files -- the main slowdown.
#   2. `yarn install --mode=skip-build` skips postinstall (incl. webship-js
#      pulling Playwright). Install drops to ~10s.
#   3. package.json-keyed cache of `.yarn/cache` reused by later pipelines.
# The paired .eslintignore excludes vendor/, .yarn/, web/ so `eslint .` only
# lints real module source.
.lint-yarn:
  image: node:24
  dependencies: []
  variables:
    YARN_ENABLE_GLOBAL_CACHE: "false"
  cache:
    key:
      files:
        - package.json
    paths:
      - .yarn/cache
  before_script:
    - corepack enable
    - yarn install --mode=skip-build

eslint:
  extends: .lint-yarn
  stage: validate
  script:
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: true

stylelint:
  extends: .lint-yarn
  stage: validate
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: true

# ─── Shared Drupal + Node.js setup for browser tests ──────────────────────────
#
# How it works:
#   1. The drupalci `composer` job builds a full Drupal site (webdev plus
#      its dependencies) and passes its artifact to this job via
#      `needs: [composer]`.
#   2. This job runs inside the drupalci PHP-Apache image (inherited from
#      `.testing-job-base`) which already has PHP, Apache, Drush, and MySQL.
#   3. before_script installs Drupal + the module, then Node.js + yarn deps +
#      Playwright Chromium. Test jobs only override `script:`.
#   4. The site build creates the accounts of cucumber.js
#      (worldParameters.users) with drush; the suite only logs in.
# ──────────────────────────────────────────────────────────────────────────────
.drupal-node-base:
  extends: .testing-job-base
  needs: [composer]
  # Override the parent's services — we only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    # The accounts of cucumber.js worldParameters.users. Their passwords are
    # made in before_script, for this throwaway site only.
    DRUPAL_ADMIN_USER: "webmaster"
    DRUPAL_ADMIN_MAIL: "webmaster@example.test"
    DRUPAL_EDITOR_USER: "content_editor_user"
    DRUPAL_EDITOR_MAIL: "content_editor_user@example.test"
    DRUPAL_AUTHENTICATED_USER: "authenticated_user"
    DRUPAL_AUTHENTICATED_MAIL: "authenticated_user@example.test"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  before_script:
    # ── Web server ──────────────────────────────────────────────────────────
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    # ── Database ────────────────────────────────────────────────────────────
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
    # ── Test account passwords, for this job only ──────────────────────────
    - export DRUPAL_ADMIN_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export DRUPAL_EDITOR_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export DRUPAL_AUTHENTICATED_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    # ── Drupal site install ─────────────────────────────────────────────────
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB
        --account-name="$DRUPAL_ADMIN_USER"
        --account-mail="$DRUPAL_ADMIN_MAIL"
        --account-pass="$DRUPAL_ADMIN_PASS"
        --site-name="Web Development Test"
        -y
    # ── Core content types ──────────────────────────────────────────────────
    # Drupal 11.4's `standard` profile no longer ships any content types
    # (no Article, no Basic page). The webdev test suite authors and edits
    # Basic pages, so apply the core recipe that creates the type before
    # enabling webdev.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/$_WEB_ROOT/core/recipes/page_content_type -y
    # ── Module install ──────────────────────────────────────────────────────
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT en webdev -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # ── Test accounts (cucumber.js worldParameters.users) ───────────────────
    # The suite never creates or deletes an account: the site build does.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create "$DRUPAL_EDITOR_USER" --mail="$DRUPAL_EDITOR_MAIL" --password="$DRUPAL_EDITOR_PASS"
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:role:add content_editor "$DRUPAL_EDITOR_USER"
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create "$DRUPAL_AUTHENTICATED_USER" --mail="$DRUPAL_AUTHENTICATED_MAIL" --password="$DRUPAL_AUTHENTICATED_PASS"
    # ── Node.js 24 ──────────────────────────────────────────────────────────
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    # ── Yarn deps + Playwright Chromium ─────────────────────────────────────
    # Force node_modules layout so node_modules/.bin/* is populated.
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js — webship-js's postinstall can clobber it under yarn 4
    # because INIT_CWD may differ from our project root inside the container.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    # Restore cucumber.js if postinstall overwrote it with the init-webship template.
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# ─── webship-js BDD functional tests ──────────────────────────────────────────
webship-js-test:
  extends: .drupal-node-base
  script:
    - ./node_modules/.bin/cucumber-js --config cucumber.js --dry-run
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml
  allow_failure: false
